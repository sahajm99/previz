apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: previz-filmmaking-suite
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/memory: "2Gi"
        run.googleapis.com/cpu: "1"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: default
      containers:
        - image: gcr.io/nyu-ai-builder26nyc-9338/previz-backend:latest
          ports:
            - name: http1
              containerPort: 8000
          env:
            - name: GCP_PROJECT
              value: "nyu-ai-builder26nyc-9338"
            - name: GCP_LOCATION
              value: "us-central1"
