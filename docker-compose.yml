version: '3.8'

services:
  previz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: previz-app
    ports:
      - "8000:8000"
    environment:
      - GCP_PROJECT=nyu-ai-builder26nyc-9338
      - GCP_LOCATION=us-central1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - ./backend/demo_cache:/app/backend/demo_cache
      - ~/.config/gcloud:/root/.config/gcloud:ro
    restart: unless-stopped
